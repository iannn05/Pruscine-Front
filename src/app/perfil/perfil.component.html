<div class="head">
    <h2>Perfil de {{ usuario.nombre }}</h2>
    <button (click)="modificarPerfil()">Modificar perfil</button>
    <button id="eliminarPerfil" (click)="eliminarPerfil()">Eliminar perfil</button>
    <button (click)="logOut()">Cerrar sesion</button>
</div>
<section>
  <div *ngIf="modificar" class="form">
    <form [formGroup]="formulario" >
      <label>Nombre:</label>
      <input formControlName="nombre" type="text" class="form-control">
      <label>Email:</label>
      <input formControlName="email" type="email" class="form-control">
      <br>
      <label>Contraseña:</label>
      <input formControlName="contrasenia" type="password" class="form-control">
      <br>
      <label>Fecha de Nacimiento:</label>
      <input formControlName="fechaNacimiento" type="date" class="form-control">
      <br>
      <button (click)="cancelar()">Cancelar</button>
      <button (click)="guardar()">Guardar</button>
    </form>
  </div>
</section>
<div>
  <p>Mis listas:</p>
  
  <div *ngFor="let lista of listas">
    <div>
      <h3>{{ lista.nombre }}</h3>
        <button *ngIf="lista.idlista" [routerLink]="['/informacion-lista', lista.idlista]">
          Más información
        </button>
    </div>
  </div>
  
</div>
