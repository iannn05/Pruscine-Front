<div *ngIf="lista" class="detail-container">
    <h1 id="p">{{ lista.lista.nombre }}</h1>
</div>

<div>
    <h1>Peliculas:</h1>
    <div *ngFor="let pelicula of peliculas" id="loop">
        <div class="reseña">
            <p><strong>Nombre:</strong> {{ pelicula.nombre }}</p>
        </div>
    </div>
</div>

<div id="buttons">
    <button [routerLink]="['/listas']">Volver</button>
    <button (click)="copiarLista()">Copiar Lista</button>
</div>
