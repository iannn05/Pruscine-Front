<div *ngIf="pelicula" class="detail-container">
    <h1>{{ pelicula.nombre }}</h1>
    <p><strong>Año de publicación:</strong> {{ pelicula.anioPublicado }}</p>
    <p><strong>País:</strong> {{ pelicula.pais }}</p>
    <p><strong>Géneros:</strong> {{ nombresGeneros }}</p>
    <p><strong>Actores:</strong> {{ pelicula.actores?.join(', ') }}</p>
    <p><strong>Directores:</strong> {{ pelicula.directores?.join(', ') }}</p>
</div>
